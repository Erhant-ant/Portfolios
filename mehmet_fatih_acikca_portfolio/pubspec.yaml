name: fatih_hoca_portfolio
description: Mehmet Fatih Açıkça - Özel Eğitim Öğretmeni Kişisel Web Sitesi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_web_plugins:
    sdk: flutter
  # Routing (Sayfa yönlendirmeleri)
  go_router: ^13.2.0
  # Modern ve okunaklı tipografi için Google Fonts
  google_fonts: ^6.2.1
  # İletişim (Tel, Mail, WhatsApp) ve dış linkler için
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/